name: API Reliability Check

on:
  push:
    branches: [main]
  workflow_dispatch: {}
    # Adds a manual "Run workflow" button on the Actions tab —
    # lets you (or a reviewer) trigger the demo on demand from GitHub,
    # no local setup required.

jobs:
  run-reliability-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run reliability agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python demo.py --target https://backend-project-api-cswq.onrender.com | tee reliability-report.txt

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report
          path: reliability-report.txt
          retention-days: 30